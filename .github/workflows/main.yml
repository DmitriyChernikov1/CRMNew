name: API Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Run tests
        run: mvn test

      - name: Debug file structure after tests
        if: always()
        run: |
          echo "=== Текущая рабочая директория ==="
          pwd
          echo "=== Содержимое корня проекта (первые 2 уровня) ==="
          ls -la
          echo "=== Поиск папки allure-results ==="
          find . -name "allure-results" -type d
          echo "=== Поиск любых файлов/папок с именем allure ==="
          find . -name "*allure*" 2>/dev/null | head -10

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: ./allure-results
